name: AI Review Rerun

on:
  workflow_run:
    workflows: [AI Review]
    types: [completed]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  ai-review-rerun:
    name: ai-review-rerun
    if: |
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        contains(fromJSON('["failure","cancelled","timed_out","action_required","success"]'), github.event.workflow_run.conclusion)
      ) ||
      github.event_name == 'pull_request_review' ||
      (
        github.event.issue.pull_request &&
        (
          startsWith(github.event.comment.body, 'Codex Review:') ||
          contains(github.event.comment.body, '<!-- codex-review-receipt:') ||
          contains(github.event.comment.body, '<!-- codex-pull-request-review-summary') ||
          contains(github.event.comment.body, 'AI_REVIEW_OUTCOME:')
        )
      )
    concurrency:
      group: ai-review-rerun-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR content
        if: ${{ github.event_name == 'pull_request_review' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout trusted rerun scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .rerun-trusted
          fetch-depth: 1

      - name: Rerun AI Review for trusted evidence
        run: |
          if [ -f .rerun-trusted/scripts/ai-review-rerun.mjs ]; then
            AI_REVIEW_CONFIG_ROOT=.rerun-trusted node .rerun-trusted/scripts/ai-review-rerun.mjs
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request_review" ]; then
            echo "::warning::Trusted AI review rerun script missing on default branch; using PR script for first-install bootstrap only."
            node scripts/ai-review-rerun.mjs
          else
            echo "::warning::Trusted AI review rerun script missing on default branch; skipping issue-comment bootstrap because PR-head content is not checked out for this event."
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_AGENT: ${{ vars.AI_REVIEW_AGENT }}
